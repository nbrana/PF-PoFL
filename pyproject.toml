[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pofl"
version = "0.1.0"
description = "Platform-Free Proof of Federated Learning — Python PoC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
chain = ["substrate-interface>=1.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pofl*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905", "B007"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_simulation.py" = ["E402"]
